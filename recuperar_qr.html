
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar QR Code</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f5f9;
      font-family: Arial, Helvetica, sans-serif;
      color: #263248;
    }

    .card {
      width: 100%;
      max-width: 460px;
      padding: 30px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 5px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      font-size: 25px;
      color: #183b66;
    }

    .intro {
      margin: 0 0 24px;
      text-align: center;
      line-height: 1.5;
      color: #596579;
      font-size: 15px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd3df;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2463a6;
      box-shadow: 0 0 0 3px rgba(36, 99, 166, 0.12);
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #205b99;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #174778;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #eef3f8;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .result {
      display: none;
      margin-top: 24px;
      text-align: center;
      border-top: 1px solid #e1e6ee;
      padding-top: 24px;
    }

    #name {
      font-weight: bold;
      margin-bottom: 16px;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 16px;
      min-height: 20px;
    }

    #qrcode img,
    #qrcode canvas {
      max-width: 100%;
      height: auto;
    }

    .note {
      font-size: 13px;
      line-height: 1.5;
      color: #596579;
    }

    .back {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #205b99;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .card {
        padding: 23px 18px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Recuperar meu QR Code</h1>

    <p class="intro">
      Informe o CPF cadastrado para recuperar seu QR Code.
    </p>

    <form id="form">
      <label for="cpf">CPF cadastrado</label>

      <input
        id="cpf"
        type="text"
        inputmode="numeric"
        maxlength="14"
        autocomplete="off"
        placeholder="000.000.000-00"
        required
      >

      <button id="submitBtn" type="submit">
        Recuperar QR Code
      </button>
    </form>

    <div id="status" class="status" role="status" hidden></div>

    <section id="result" class="result">
      <h2>QR Code recuperado</h2>

      <p id="name"></p>

      <div id="qrcode"></div>

      <p class="note">
        Apresente este QR Code à equipe do evento para confirmar sua presença.
      </p>
    </section>

    <a class="back" href="./index_cadastro_inicial_refeito2.html">
      Voltar ao cadastro
    </a>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="./config.js"></script>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const cfg = window.EVENTO_CONFIG || {};

      function digits(value) {
        return String(value || "").replace(/\D/g, "");
      }

      function formatCPF(value) {
        const cpf = digits(value).slice(0, 11);

        return cpf
          .replace(/^(\d{3})(\d)/, "$1.$2")
          .replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3")
          .replace(/\.(\d{3})(\d)/, ".$1-$2");
      }

      function showMessage(message, error = false) {
        $("status").textContent = message;
        $("status").hidden = false;
        $("status").style.background = error ? "#fdecec" : "#eaf6ed";
        $("status").style.color = error ? "#a12626" : "#216638";
      }

      $("cpf").addEventListener("input", event => {
        event.target.value = formatCPF(event.target.value);
      });

      $("form").addEventListener("submit", async event => {
        event.preventDefault();

        $("result").style.display = "none";
        $("status").hidden = true;

        const cpf = digits($("cpf").value);

        if (cpf.length !== 11) {
          showMessage("Informe um CPF válido com 11 números.", true);
          return;
        }

        if (!cfg.url || !cfg.anonKey) {
          showMessage("Configuração do serviço indisponível.", true);
          return;
        }

        if (typeof QRCode === "undefined") {
          showMessage("Não foi possível carregar o gerador de QR Code. Verifique sua conexão.", true);
          return;
        }

        $("submitBtn").disabled = true;
        $("submitBtn").textContent = "Consultando...";

        try {
          const response = await fetch(
            cfg.url.replace(/\/+$/, "") + "/functions/v1/recuperar-qr",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "apikey": cfg.anonKey,
                "Authorization": "Bearer " + cfg.anonKey
              },
              body: JSON.stringify({ cpf })
            }
          );

          const data = await response.json().catch(() => ({}));

          if (!response.ok || !data.ok || !data.qr_token) {
            showMessage(
              data.message || "Não foi possível recuperar o QR Code. Código: " + response.status,
              true
            );
            return;
          }

          $("name").textContent = data.name || "Participante";
          $("qrcode").replaceChildren();

          new QRCode($("qrcode"), {
            text: data.qr_token,
            width: 240,
            height: 240,
            correctLevel: QRCode.CorrectLevel.M
          });

          $("result").style.display = "block";
          showMessage("QR Code recuperado com sucesso.");

        } catch (error) {
          showMessage(
            "Não foi possível conectar ao serviço. Verifique sua conexão e tente novamente.",
            true
          );
          console.error("Erro na recuperação do QR Code:", error);
        } finally {
          $("submitBtn").disabled = false;
          $("submitBtn").textContent = "Recuperar QR Code";
        }
      });
    })();
  </script>
</body>
</html>
